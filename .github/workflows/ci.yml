name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ReadinessCore
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The pure domain package has no simulator and no Apple frameworks, so this
      # job returns a signal on the logic that actually matters within seconds,
      # independently of the much slower app build below.
      - name: Test pure domain package
        run: swift test --package-path Packages/ReadinessCore

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  app:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # CI invokes Fastlane rather than xcodebuild directly, so the lane is the
      # single source of truth and `bundle exec fastlane test` reproduces CI locally.
      - name: Test
        run: bundle exec fastlane test

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: fastlane/test_output
          retention-days: 7
