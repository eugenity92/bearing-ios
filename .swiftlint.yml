included:
  - Bearing
  - BearingTests
  - BearingUITests
  - Packages/ReadinessCore/Sources
  - Packages/ReadinessCore/Tests

excluded:
  - .build
  - .spm
  - DerivedData

disabled_rules:
  # This codebase deliberately spells existential types out in full
  # (`private var x: any NetworkService`) even where they are inferrable.
  - redundant_type_annotation
  # `Bundle.main.bundleIdentifier!` appears in every per-file logger declaration.
  - force_unwrapping

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 450
  error: 600

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 2
  excluded: [z, x, y, id, to]

nesting:
  type_level: 2

custom_rules:
  no_mark_comments:
    name: "No MARK sections"
    regex: "//\\s*MARK:"
    message: "MARK sections are not used in this project — extract a type instead."
    severity: error

  no_gcd:
    name: "No GCD"
    regex: "\\b(DispatchQueue|DispatchGroup|DispatchSemaphore)\\b"
    message: "Use Swift Concurrency (async/await, Task, actors) instead of GCD."
    severity: error

reporter: "xcode"
